name: mutants-caller

# Phase 2 test caller for the reusable mutants.yml in this repo (`uses: ./`).
# Production callers pin tatari-tv/github-actions-public/.github/workflows/mutants.yml@vX.Y.Z.
# Probe-only knobs (throwaway repo):
#   vars.MUTANTS_SHARD_TIMEOUT  short shard timeout, for the forced mid-run failure test
#   vars.MUTANTS_TARGET_WALL    small target-wall, to force N > 1 shards on a small diff
#   fork PRs claim private-deps, for the fork + private-deps -> incomplete test
on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  mutants:
    uses: ./.github/workflows/mutants.yml
    with:
      target-wall: ${{ fromJSON(vars.MUTANTS_TARGET_WALL || '600') }}
      shard-timeout-minutes: ${{ fromJSON(vars.MUTANTS_SHARD_TIMEOUT || '0') }}
      private-deps: ${{ github.event.pull_request.head.repo.fork == true }}
